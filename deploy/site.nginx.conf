# nginx on the VPS (webpro.drmatt.dev): public front for the Portsmouth Cycle
# Forum website, which runs under pm2 on 127.0.0.1:3120.
# nginx here is 1.24: keep `listen 443 ssl http2;`, there is no `http2 on;`.
# Installed by deploy/install-nginx.sh, which replaces __DOMAIN__; edit it in
# the repo, not on the box.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # certbot renewals: must stay local, ahead of the redirect.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/block-dotfiles.conf;

    server_tokens off;
    # Editors upload photos straight from phones; the app caps a file at 20 MB.
    client_max_body_size 25m;

    # The app sets its own security headers (helmet), so none are added here.

    location / {
        # No path after the port: nginx then passes the address through
        # untouched, which the editor relies on for page names containing %2F.
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
